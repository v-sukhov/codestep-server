host: localhost
info:
  description: Documentation of codestep JSON API.
  title: classification codestep
  version: 1.0.0
paths:
  /api/login:
    post:
      description: Authenticate user
      operationId: idOfLoginEndpoint
      parameters:
      - description: Login and password
        in: body
        name: Body
        schema:
          $ref: '#/definitions/LoginRequest'
      responses:
        "200":
          $ref: '#/responses/loginResponse'
      tags:
      - login
  /api/protected/add-participation-time:
    post:
      description: Операцию может выполнить только владелец или администратор контеста.
      operationId: idOfAddParticipationTimeEndpoint
      parameters:
      - in: body
        name: Body
        schema:
          $ref: '#/definitions/AddParticipationTimeRequest'
      responses:
        "200":
          $ref: '#/responses/addParticipationTimeResponse'
      summary: Устанавливает добавленное время участникам соревнования по userId.
      tags:
      - add-participation-time
  /api/protected/add-supertask-to-contest:
    post:
      description: НЕ ИСПОЛЬЗУЕТСЯ!!! Добавить суперзадачу в контест
      operationId: idOfAddSupertaskToContestEndpoint
      parameters:
      - in: body
        name: Body
        schema:
          $ref: '#/definitions/AddSupertaskToContestRequest'
      responses:
        "200":
          $ref: '#/responses/addSupertaskToContestResponse'
      tags:
      - add-supertask-to-contest
  /api/protected/get-contest:
    post:
      description: Возвращает данные контеста
      operationId: idOfGetContestEndpoint
      parameters:
      - in: body
        name: Body
        schema:
          $ref: '#/definitions/GetContestRequest'
      responses:
        "200":
          $ref: '#/responses/getContestResponse'
      tags:
      - get-contest
  /api/protected/get-contest-participation-info:
    post:
      description: |-
        Без userIdList возвращает информацию по вызвавшему пользователю.
        С userIdList возвращает информацию по указанным пользователям (только для владельца и администратора контеста).
      operationId: idOfGetContestParticipationInfoEndpoint
      parameters:
      - in: body
        name: Body
        schema:
          $ref: '#/definitions/GetContestParticipationInfoRequest'
      responses:
        "200":
          $ref: '#/responses/getContestParticipationInfoResponse'
      summary: Возвращает информацию об участии пользователя(ей) в контесте.
      tags:
      - get-contest-participation-info
  /api/protected/get-contest-results:
    post:
      description: Возвращает результаты участников контеста, отсортированные в порядке убывания баллов, решённых задач и возрастрания количества попыток
      operationId: idOfGetContestResultsEndpoint
      parameters:
      - in: body
        name: Body
        schema:
          $ref: '#/definitions/GetContestResultsRequest'
      responses:
        "200":
          $ref: '#/responses/getContestResultsResponse'
      tags:
      - get-contest-results
  /api/protected/get-contest-results-file:
    post:
      description: Возвращает результаты участников контеста, отсортированные в порядке убывания баллов, решённых задач и возрастрания количества попыток в файле
      operationId: idOfGetContestResultsFileEndpoint
      parameters:
      - in: body
        name: Body
        schema:
          $ref: '#/definitions/GetContestResultsFileRequest'
      responses:
        "200":
          $ref: '#/responses/getContestResultsFileResponse'
      tags:
      - get-contest-results-file
  /api/protected/get-contest-supertask-list:
    post:
      description: Возвращает список суперзадач контеста, отсортированный в порядке order_number
      operationId: idOfGetContestSupertaskListEndpoint
      parameters:
      - in: body
        name: Body
        schema:
          $ref: '#/definitions/GetContestSupertaskListRequest'
      responses:
        "200":
          $ref: '#/responses/getContestSupertaskListResponse'
      tags:
      - get-contest-supertask-list
  /api/protected/get-supertask:
    post:
      description: |-
        Возвращает объект версии суперзадачи
        Если versionNumber присутствует и != 0 - возвращает соответствующую закоммиченную версию
        Иначе если authorUserId присутствует и != 0 - возвращает рабочую версию соответствующего пользователя
        Иначе возвращает рабочую версию запрашивающего пользователя
      operationId: idOfGetSupertaskEndpoint
      parameters:
      - in: body
        name: Body
        schema:
          $ref: '#/definitions/GetSupertaskRequest'
      responses:
        "200":
          $ref: '#/responses/getSupertaskResponse'
      tags:
      - get-supertask
  /api/protected/get-supertask-all-tasks-results:
    post:
      description: Получить результаты по всем задачам суперзадачи
      operationId: idOfGetSupertaskAllTasksResultsEndpoint
      parameters:
      - in: body
        name: Body
        schema:
          $ref: '#/definitions/GetSupertaskAllTasksResultsRequest'
      responses:
        "200":
          $ref: '#/responses/getSupertaskAllTasksResultsResponse'
      tags:
      - get-supertask-all-tasks-results
  /api/protected/get-supertask-in-contest-with-results:
    post:
      description: Получить данные актуальной версии суперзадачи с результатами запрашивающего пользователя
      operationId: idOfGetSupertaskInContestWithResultsEndpoint
      parameters:
      - in: body
        name: Body
        schema:
          $ref: '#/definitions/GetSupertaskInContestWithResultsRequest'
      responses:
        "200":
          $ref: '#/responses/getSupertaskInContestWithResultsResponse'
      tags:
      - get-supertask-in-contest-with-results
  /api/protected/get-supertask-result:
    post:
      description: Получить результат по задаче
      operationId: idOfGetSupertaskResultEndpoint
      parameters:
      - in: body
        name: Body
        schema:
          $ref: '#/definitions/GetSupertaskResultRequest'
      responses:
        "200":
          $ref: '#/responses/getSupertaskResultResponse'
      tags:
      - get-supertask-result
  /api/protected/get-supertask-solution:
    post:
      description: Получить решение задачи
      operationId: idOfGetSupertaskSolutionEndpoint
      parameters:
      - in: body
        name: Body
        schema:
          $ref: '#/definitions/GetSupertaskSolutionRequest'
      responses:
        "200":
          $ref: '#/responses/getSupertaskSolutionResponse'
      tags:
      - get-supertask-solution
  /api/protected/get-supertask-versions:
    post:
      description: Возвращает список версий суперзадачи
      operationId: idOfGetSupertaskVersionsEndpoint
      parameters:
      - in: body
        name: Body
        schema:
          $ref: '#/definitions/GetSupertaskVersionsRequest'
      responses:
        "200":
          $ref: '#/responses/getSupertaskVersionsResponse'
      tags:
      - get-supertask-versions
  /api/protected/get-user-contest-list:
    post:
      description: Возвращает список контестов пользователя с указанием уровня прав
      operationId: idOfGetUserContestListEndpoint
      parameters:
      - in: body
        name: Body
        schema:
          $ref: '#/definitions/GetUserContestListRequest'
      responses:
        "200":
          $ref: '#/responses/getUserContestListResponse'
      tags:
      - get-user-contest-list
  /api/protected/get-user-supertask-list:
    post:
      description: Get supertask list for current user
      operationId: idOfGetUserSupertaskListEndpoint
      parameters:
      - in: body
        name: Body
        schema:
          $ref: '#/definitions/GetUserSupertaskListRequest'
      responses:
        "200":
          $ref: '#/responses/getUserSupertaskListResponse'
      tags:
      - get-user-supertask-list
  /api/protected/remove-supertask-from-contest:
    post:
      description: Удаляет суперзадачу из контеста
      operationId: idOfRemoveSupertaskFromContestEndpoint
      parameters:
      - in: body
        name: Body
        schema:
          $ref: '#/definitions/RemoveSupertaskFromContestRequest'
      responses:
        "200":
          $ref: '#/responses/removeSupertaskFromContestResponse'
      tags:
      - remove-supertask-from-contest
  /api/protected/save-contest:
    post:
      description: Если contestId = 0, значит создаёт новый
      operationId: idOfSaveContestEndpoint
      parameters:
      - in: body
        name: Body
        schema:
          $ref: '#/definitions/SaveContestRequest'
      responses:
        "200":
          $ref: '#/responses/saveContest'
      summary: Сохранить контест (перезаписывает данные контеста). Требует прав владельца или администратора контеста.
      tags:
      - save-contest
  /api/protected/save-supertask:
    post:
      description: |-
        Save supertask
        Если SupertaskId = 0 - создаётся новый supertask
        Если Commited = true создаётся закоммиченная неизменяемая версия supertask.
        Ей присвивается новый номер версии. При этом указывается ParentVersionNumber - от какой версии произведена.
        Если ParentVersionNumber = 0 - то это считается первоначальной версией, то есть которая ни от чего не произведена.
        Если Commited = false создаётся незакоммиченная версия данного пользователя.
        Незакоммиченная версия у данного ползователя может быть только одна.
      operationId: idOfSaveSupertaskEndpoint
      parameters:
      - in: body
        name: Body
        schema:
          $ref: '#/definitions/SaveSupertaskRequest'
      responses:
        "200":
          $ref: '#/responses/saveSupertaskResponse'
      tags:
      - save-supertask
  /api/protected/save-supertask-result:
    post:
      description: Сохранить результат тестирования задачи
      operationId: idOfSaveSupertaskResultEndpoint
      parameters:
      - in: body
        name: Body
        schema:
          $ref: '#/definitions/SaveSupertaskResultRequest'
      responses:
        "200":
          $ref: '#/responses/saveSupertaskResultResponse'
      tags:
      - save-supertask-result
  /api/protected/save-supertask-solution:
    post:
      description: Сохранить решение задачи
      operationId: idOfSaveSupertaskSolutionEndpoint
      parameters:
      - in: body
        name: Body
        schema:
          $ref: '#/definitions/SaveSupertaskSolutionRequest'
      responses:
        "200":
          $ref: '#/responses/saveSupertaskSolutionResponse'
      tags:
      - save-supertask-solution
  /api/protected/upload-add-participation-time-file:
    post:
      description: "login\tadded_time_sec\n\nОперацию может выполнить только владелец или администратор контеста."
      operationId: idOfAddParticipationTimeFileEndpoint
      responses:
        "200":
          $ref: '#/responses/addParticipationTimeFileResponse'
      summary: |-
        Устанавливает добавленное время участникам соревнования через импорт файла.
        Получает на вход multipart/form-data с полями contestId и participationTimeList.
        Структура файла (разделитель - табуляции или пробелы):
      tags:
      - upload-add-participation-time-file
  /api/protected/upload-create-user-list:
    post:
